# Push to main runs the tests, then publishes.
# A pull request only runs the tests.
# Publishing needs three GitHub secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
# Without them, the tests still run and the publish step skips.

name: Check and publish

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test the catalog
        run: npm test

      - name: Check types
        run: npm run check

      - name: Build the site
        run: npm run build

      - name: Publish to Vercel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Vercel secrets are not set. Tests passed. Deploy skipped."
            exit 0
          fi
          npm install --global vercel@64.5.0
          # The CLI reads VERCEL_TOKEN from the environment. Leaving it off the
          # command line keeps it out of the process list.
          vercel pull --yes --environment=production
          vercel build --prod
          vercel deploy --prebuilt --prod
